
services:
  # 1. Redis 缓存服务
  redis:
    image: redis:7-alpine
    container_name: ${REDIS_CONTAINER_NAME}
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    volumes:
      - ./redis_data:/data
    networks:
      - ylf-network
    ports:
      - "${REDIS_PORT}:${REDIS_INTERNAL_PORT}"

  # 2. 数据库服务
  db:
    build:
      context: .
      dockerfile: docker/mysql/Dockerfile
    image: ${MYSQL_CONTAINER_NAME}:latest # <--- 显式指定镜像名
    container_name: ${MYSQL_CONTAINER_NAME}
    volumes:
      - ./db_data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    networks:
      - ylf-network
    ports:
      - "${MYSQL_PORT}:${MYSQL_INTERNAL_PORT}"

  # 2. 后端服务 (Django)
  backend:
    build:
      context: ./UniDjango
    image: ${BACKEND_CONTAINER_NAME}:latest # <--- 显式指定镜像名
    container_name: ${BACKEND_CONTAINER_NAME}
    restart: always
    environment:
      # 生产环境关闭调试模式
      DEBUG: "False"
      # 数据库配置
      DB_HOST: ${MYSQL_CONTAINER_NAME}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_INTERNAL_PORT: ${MYSQL_INTERNAL_PORT}
      # Django 配置
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1}
      DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE:-Asia/Shanghai}
      DJANGO_LANGUAGE_CODE: ${DJANGO_LANGUAGE_CODE:-zh-hans}
      CORS_ORIGIN_ALLOW_ALL: "False"
      # JWT 独立签名密钥（不要与 DJANGO_SECRET_KEY 复用）
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      # 前面有一层 Nginx 反向代理，用于正确解析客户端真实 IP
      TRUSTED_PROXY_COUNT: "1"
      # HTTPS 部署时在 .env 中打开，HTTP 部署保持默认关闭
      DJANGO_SECURE_SSL_REDIRECT: ${DJANGO_SECURE_SSL_REDIRECT:-False}
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-31536000}
      DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS: ${DJANGO_SECURE_HSTS_INCLUDE_SUBDOMAINS:-True}
      DJANGO_SECURE_HSTS_PRELOAD: ${DJANGO_SECURE_HSTS_PRELOAD:-True}
      DJANGO_CSRF_COOKIE_SECURE: ${DJANGO_CSRF_COOKIE_SECURE:-True}
      # Redis 配置
      REDIS_HOST: ${REDIS_CONTAINER_NAME}
      REDIS_PORT: ${REDIS_INTERNAL_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: >
      sh -c "python manage.py migrate --noinput &&
      gunicorn UniDjango.wsgi:application --bind 0.0.0.0:8000 --timeout 300 --workers 2"
    volumes:
      - ./UniDjango/media:/app/media
    depends_on:
      - db
      - redis
    networks:
      - ylf-network
    ports:
      # 生产环境后端只绑定宿主机回环地址，避免绕过 Nginx 直接暴露公网。
      # 外部请求统一通过 frontend 的 /prod-api/ 反代访问 backend:8000。
      - "127.0.0.1:${BACKEND_PORT}:${BACKEND_INTERNAL_PORT}"

  # 3. 前端服务 (Vue + Nginx) - 生产环境模式
  frontend:
    build:
      context: ./frontend  # <--- 注意这里改成了相对路径
      args:
        VUE_APP_BASE_API: /prod-api
    image: ${FRONTEND_CONTAINER_NAME}:latest # <--- 显式指定镜像名
    container_name: ${FRONTEND_CONTAINER_NAME}
    restart: always
    ports:
      # - "80:80" # 开发模式下注释掉，避免端口冲突
      - "${FRONTEND_PORT}:${FRONTEND_INTERNAL_PORT}" # 映射到其他端口
    volumes:
      - ./UniDjango/media:/media:ro  # 媒体文件由 Nginx 直接托管
      - ./frontend/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro  # 便于更新反代配置
    depends_on:
      - backend
    networks:
      - ylf-network

networks:
  ylf-network:
    driver: bridge
